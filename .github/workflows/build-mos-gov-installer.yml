name: Build MOS-GOV V0.2 Windows Installer

concurrency:
  group: mos-gov-v0.2-installer
  cancel-in-progress: true

on:
  push:
    branches:
      - feature/mos-gov-v0.2-installer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/build.ps1

      - name: Installer smoke test
        shell: pwsh
        timeout-minutes: 20
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist\MOS-GOV-V0.2-Setup.exe"
          if (-not (Test-Path $exe)) { throw "Installer not found." }

          $setupLog = Join-Path $env:TEMP "MOS-GOV-Setup.log"
          Remove-Item $setupLog -Force -ErrorAction SilentlyContinue
          Write-Host "Starting installer: $exe"
          $p = Start-Process -FilePath $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/LOG=$setupLog" -PassThru
          if (-not $p.WaitForExit(480000)) {
            Write-Host "Installer exceeded 8-minute smoke-test timeout; terminating process tree."
            & taskkill.exe /PID $p.Id /T /F | Out-Host

            Write-Host "=== Inno Setup log after timeout ==="
            if (Test-Path $setupLog) {
              Get-Content $setupLog -Tail 500
            } else {
              Write-Host "Inno Setup log not found: $setupLog"
            }

            Write-Host "=== MOS-GOV service diagnostics after timeout ==="
            Get-Service -Name "MOS-GOV-*" -ErrorAction SilentlyContinue |
              Select-Object Name, Status, StartType |
              Format-Table -AutoSize

            Write-Host "=== installer.log after timeout ==="
            $installerLog = Join-Path $env:ProgramData "MOS-GOV\\logs\\installer.log"
            if (Test-Path $installerLog) {
              Get-Content $installerLog -Raw
            } else {
              Write-Host "installer.log not found: $installerLog"
            }

            Write-Host "=== apache-error.log after timeout ==="
            $apacheLog = Join-Path $env:ProgramData "MOS-GOV\\logs\\apache-error.log"
            if (Test-Path $apacheLog) {
              Get-Content $apacheLog -Tail 300
            } else {
              Write-Host "apache-error.log not found: $apacheLog"
            }

            Write-Host "=== install-state.json after timeout ==="
            $statePath = Join-Path $env:ProgramData "MOS-GOV\\config\\install-state.json"
            if (Test-Path $statePath) {
              Get-Content $statePath -Raw
            } else {
              Write-Host "install-state.json not found: $statePath"
            }

            Write-Host "=== runtime markers after timeout ==="
            Get-ChildItem (Join-Path $env:ProgramData "MOS-GOV\\config") -Filter "runtime-*.txt" -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "--- $($_.FullName) ---"
                Get-Content $_.FullName -Raw
              }

            Write-Host "=== sc.exe service queries after timeout ==="
            sc.exe query MOS-GOV-Apache
            sc.exe query MOS-GOV-MariaDB

            throw "Installer exceeded 8-minute smoke-test timeout."
          }
          $p.Refresh()
          Write-Host "Installer exit code: $($p.ExitCode)"
          
          Write-Host "=== Inno Setup log ==="
          if (Test-Path $setupLog) {
            Get-Content $setupLog -Tail 300
          } else {
            Write-Host "Inno Setup log not found: $setupLog"
          }

          Write-Host "=== MOS-GOV service diagnostics ==="
          Get-Service -Name "MOS-GOV-*" -ErrorAction SilentlyContinue |
            Select-Object Name, Status, StartType |
            Format-Table -AutoSize

          Write-Host "=== installer.log ==="
          $installerLog = Join-Path $env:ProgramData "MOS-GOV\logs\installer.log"
          if (Test-Path $installerLog) {
            Get-Content $installerLog -Raw
          } else {
            Write-Host "installer.log not found: $installerLog"
          }

          Write-Host "=== apache-error.log ==="
          $apacheLog = Join-Path $env:ProgramData "MOS-GOV\logs\apache-error.log"
          if (Test-Path $apacheLog) {
            Get-Content $apacheLog -Tail 200
          } else {
            Write-Host "apache-error.log not found: $apacheLog"
          }

          Write-Host "=== install-state.json ==="
          $statePath = Join-Path $env:ProgramData "MOS-GOV\config\install-state.json"
          if (Test-Path $statePath) {
            Get-Content $statePath -Raw
          } else {
            Write-Host "install-state.json not found: $statePath"
          }

          Write-Host "=== runtime markers ==="
          Get-ChildItem (Join-Path $env:ProgramData "MOS-GOV\config") -Filter "runtime-*.txt" -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "--- $($_.FullName) ---"
              Get-Content $_.FullName -Raw
            }

          Write-Host "=== sc.exe service queries ==="
          sc.exe query MOS-GOV-Apache
          sc.exe query MOS-GOV-MariaDB

          if ($p.ExitCode -ne 0) { throw "Installer returned exit code $($p.ExitCode)." }

          $apache = Get-Service -Name "MOS-GOV-Apache" -ErrorAction Stop
          $maria = Get-Service -Name "MOS-GOV-MariaDB" -ErrorAction Stop
          if ($apache.Status -ne "Running") { throw "MOS-GOV-Apache is not running." }
          if ($maria.Status -ne "Running") { throw "MOS-GOV-MariaDB is not running." }

          if (-not (Test-Path $statePath)) { throw "Install state not found." }
          $state = Get-Content $statePath -Raw | ConvertFrom-Json

          $url = $state.appUrl
          $deadline = (Get-Date).AddMinutes(3)
          do {
            try {
              $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 15
              if ($r.StatusCode -ge 200 -and $r.StatusCode -lt 500) { break }
            } catch {}
            Start-Sleep -Seconds 3
          } while ((Get-Date) -lt $deadline)

          if ((Get-Date) -ge $deadline) { throw "ChurchCRM did not become reachable." }

          $pluginUrl = "$($state.appUrl)plugins/mos-gov"
          try {
            $pr = Invoke-WebRequest -Uri $pluginUrl -UseBasicParsing -TimeoutSec 15 -MaximumRedirection 5
            if ($pr.StatusCode -lt 200 -or $pr.StatusCode -ge 500) {
              throw "MOS-GOV endpoint returned HTTP $($pr.StatusCode)."
            }
          } catch {
            throw "MOS-GOV endpoint smoke test failed: $($_.Exception.Message)"
          }

          Write-Host "Installer smoke test passed."
          Write-Host "Installed URL: $pluginUrl"

      - name: Calculate installer hash
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist\MOS-GOV-V0.2-Setup.exe"
          Get-FileHash $exe -Algorithm SHA256 | Format-List

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MOS-GOV-V0.2-Windows-Installer
          path: |
            dist/MOS-GOV-V0.2-Setup.exe
            dist/MOS-GOV-V0.2-Setup.sha256.json
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup installed services
        if: always()
        shell: pwsh
        run: |
          $clean = Join-Path $env:GITHUB_WORKSPACE "installer\runtime\uninstall-runtime.ps1"
          if (Test-Path $clean) {
            powershell -NoProfile -ExecutionPolicy Bypass -File $clean
          }
          Remove-Item "$env:ProgramData\MOS-GOV" -Recurse -Force -ErrorAction SilentlyContinue
