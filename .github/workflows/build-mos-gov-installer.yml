name: Build MOS-GOV V0.2.3 Windows Installer

concurrency:
  group: mos-gov-v0.2.3-installer
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - feature/mos-gov-v0.2-installer
      - feature/mos-gov-v0.2-installation-final
      - feature/mos-gov-v0.2.3-installer-init-fix
      - feature/mos-gov-v0.2.3-shortcut-fix
  workflow_dispatch:

permissions:
  contents: write

env:
  SETUP_EXE: MOS-GOV-V0.2.3-Setup.exe

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate installer assets
        shell: pwsh
        run: |
          $required = @(
            "installer\MOS-GOV-V0.2.iss",
            "installer\build.ps1",
            "installer\runtime\MOS.ico",
            "installer\runtime\MOSLauncher.exe",
            "installer\runtime\MOSLauncher.vbs",
            "installer\runtime\MOSLauncher.ps1",
            "installer\runtime\MOS-Diagnose.cmd",
            "installer\runtime\MOS-Diagnose.ps1",
            "installer\runtime\install-runtime.cmd",
            "installer\runtime\install-runtime.ps1",
            "installer\runtime\reset-church.cmd",
            "installer\runtime\reset-church.ps1",
            "installer\runtime\uninstall-runtime.cmd",
            "installer\runtime\uninstall-runtime.ps1",
            "installer\runtime\enable-mosgov.php"
          )
          foreach ($path in $required) {
            if (-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE $path))) {
              throw "Missing installer asset: $path"
            }
          }
          $ico = Get-Item (Join-Path $env:GITHUB_WORKSPACE "installer\runtime\MOS.ico")
          if ($ico.Length -lt 10240) { throw "MOS.ico looks truncated ($($ico.Length) bytes)." }
          Write-Host "All installer assets present. MOS.ico = $($ico.Length) bytes."

      - name: Validate launcher binary
        shell: pwsh
        run: |
          # 启动器必须以管理员身份运行（requireAdministrator）：
          #   * 双击快捷方式后要能直接启动 MOS-GOV-Apache / MOS-GOV-MariaDB 两个服务；
          #   * 要能把日志写进 C:\ProgramData\MOS-GOV\logs（该目录只允许 SYSTEM/Administrators）。
          # 若是默认的 asInvoker 清单，启动器会以普通权限运行：启动服务只能退回每次弹 UAC 的
          # net.exe 兜底，且 launcher.log 会被静默丢弃，诊断信息窗口打开后拿不到任何证据。
          $exe = Join-Path $env:GITHUB_WORKSPACE "installer\runtime\MOSLauncher.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text -notmatch 'requestedExecutionLevel[\s\S]{0,60}?level="requireAdministrator"') {
            $found = [regex]::Match($text, 'requestedExecutionLevel[\s\S]{0,60}')
            throw ("MOSLauncher.exe must request administrator rights; found: " + $found.Value)
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 0x5C)
          if ($subsystem -ne 2) {
            throw "MOSLauncher.exe must use the GUI subsystem so no console window appears (got $subsystem)."
          }
          Write-Host ("Launcher binary OK: requireAdministrator manifest, GUI subsystem, {0} bytes" -f $bytes.Length)

      - name: Validate shortcut and service configuration
        shell: pwsh
        run: |
          # 必须显式按 UTF-8 读取：该脚本含中文字面量，且历史提交为不带 BOM 的 UTF-8。
          $iss = Get-Content (Join-Path $env:GITHUB_WORKSPACE "installer\MOS-GOV-V0.2.iss") -Raw -Encoding UTF8
          if ($iss -notmatch 'create-mos-shortcut\.ps1') { throw "Installer must include the per-user desktop shortcut helper." }
           if ($iss -match '\{commondesktop\}.*MOS 平台') { throw "Installer must not create the MOS desktop shortcut under {commondesktop}." }
           if ($iss -notmatch 'ExecAsOriginalUser') { throw "Installer must create the desktop shortcut as the original user." }
           if ($iss -notmatch 'MOS 平台') { throw "Installer shortcuts must be named 'MOS 平台'." }
          if ($iss -match 'ç|å|æ|骞冲彴') { throw "Installer script contains mojibake; it must be saved as UTF-8." }
          if ($iss -notmatch 'MOSLauncher\.exe') { throw "Shortcuts must target MOSLauncher.exe." }
          if ($iss -notmatch 'IconFilename:\s*"\{app\}\\runtime\\MOS\.ico"') { throw "Shortcuts must use MOS.ico." }
          if ($iss -notmatch '立即打开 MOS 平台') { throw "Finish page must offer '立即打开 MOS 平台'." }
          if ($iss -notmatch 'ResetExistingData') { throw "Installer must keep the explicit existing-data reset confirmation." }
          if ($iss -notmatch '#define AppVersion "0\.2\.3"') { throw "AppVersion must be 0.2.3." }
          Write-Host "Shortcut / service / finish-page configuration validated."

      - name: Validate PowerShell runtime scripts
        shell: pwsh
        run: |
          $paths = @(
            "installer\runtime\MOS-Diagnose.ps1",
            "installer\runtime\install-runtime.ps1",
            "installer\runtime\reset-church.ps1",
            "installer\runtime\uninstall-runtime.ps1"
          )
          foreach ($relative in $paths) {
            $path = Join-Path $env:GITHUB_WORKSPACE $relative
            $errors = @()
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$null,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host ("ParserError: " + $_.Message) }
              throw "PowerShell parser found $($errors.Count) error(s) in $relative."
            }
            Write-Host "$relative syntax is valid."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          # 捕获构建输出：构建失败必须在仓库里可审计，否则失败原因只能靠猜。
          $log = Join-Path $env:GITHUB_WORKSPACE "ci-build.log"
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          powershell -NoProfile -ExecutionPolicy Bypass -File installer/build.ps1 *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            throw "installer/build.ps1 failed with exit code $LASTEXITCODE (see ci-build.log)."
          }

      - name: Installer smoke test
        shell: pwsh
        timeout-minutes: 25
        run: |
          # 全程录制输出：冒烟测试自身的失败原因也必须可审计（此前失败原因只能靠推理）。
          $smokeLog = Join-Path $env:GITHUB_WORKSPACE "ci-smoke.log"
          Start-Transcript -Path $smokeLog -Force | Out-Null
          trap {
            Write-Host ("SMOKE TEST FAILED: " + $_.Exception.Message)
            try { Stop-Transcript | Out-Null } catch { }
            throw $_
          }
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist\$env:SETUP_EXE"
          if (-not (Test-Path $exe)) { throw "Installer not found: $exe" }

          $setupLog = Join-Path $env:TEMP "MOS-GOV-Setup.log"
          Remove-Item $setupLog -Force -ErrorAction SilentlyContinue
          Write-Host "Starting installer: $exe"

          # 快捷方式定位：枚举"公共桌面 + 当前用户桌面"下的 .lnk，而不是按字面文件名拼路径。
          # 历史上正是"按字面名查找"掩盖了真正的缺陷——安装包内中文被编码损坏，
          # 图标名变成 "MOS 骞冲彴" / "MOS å¹³å°"，导致查找恒为 False（服务却是正常的）。
          function Get-DesktopMosShortcuts {
            $dirs = @(
              [Environment]::GetFolderPath('CommonDesktopDirectory'),
              [Environment]::GetFolderPath('Desktop')
            ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -Unique
            $found = @()
            foreach ($d in $dirs) {
              $found += @(Get-ChildItem -LiteralPath $d -Filter '*.lnk' -File -ErrorAction SilentlyContinue |
                          Where-Object { $_.BaseName -like '*MOS*' })
            }
            return $found
          }
          # 期望名称 "MOS 平台" 用码位构造，使断言不受工作流文件自身编码影响。
          # 注意用 -join：多参数 [string]::Concat 在 StrictMode 下无法绑定 params 重载。
          $expectedShortcutName = "MOS " + (-join @([char]0x5E73,[char]0x53F0))

          $p = Start-Process -FilePath $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/LOG=$setupLog" -PassThru
          Write-Host "Installer launcher PID: $($p.Id)"

          # 完成信号必须来自"运行环境初始化脚本自己写下的结束标记"，不能用
          # "快捷方式存在 + 服务存在" 代替：Inno 在 [Icons] 阶段（早于 [Run]）就已创建快捷方式，
          # 服务也会在 [Run] 中途出现，此时 ChurchCRM 数据库 schema 可能仍在导入。
          # 之前正是因此在"数据库未就绪"的中间状态下检查登录页，页面里没有 ChurchCRM 而失败。
          $runtimeLog = 'C:\ProgramData\MOS-GOV\logs\installer.log'
          $done = $false
          $fatal = $null
          $deadline = (Get-Date).AddMinutes(15)
          do {
            Start-Sleep -Seconds 5
            $lnks = @(Get-DesktopMosShortcuts)
            $svcA = Get-Service -Name "MOS-GOV-Apache" -ErrorAction SilentlyContinue
            $svcM = Get-Service -Name "MOS-GOV-MariaDB" -ErrorAction SilentlyContinue
            $logText = ''
            if (Test-Path -LiteralPath $runtimeLog) {
              $logText = (Get-Content -LiteralPath $runtimeLog -Raw -ErrorAction SilentlyContinue)
            }
            if ($logText -match 'MOS-GOV installation completed\.') { $done = $true; break }
            $fatalMatch = [regex]::Match($logText, '(?m)^.*FATAL:.*$')
            if ($fatalMatch.Success) { $fatal = $fatalMatch.Value.Trim(); break }
          } while ((Get-Date) -lt $deadline)

          $state = @()
          $state += "installer launcher exited: $($p.HasExited)"
          if ($p.HasExited) { $state += "installer launcher exit code: $($p.ExitCode)" }
          $state += "runtime install completed marker: $done"
          $state += "desktop lnk count: $($lnks.Count)"
          $state += "desktop lnk names: " + ((@($lnks) | ForEach-Object { $_.FullName }) -join ' | ')
          $state += "expected lnk name: $expectedShortcutName"
          $state += "apache service: $(if ($svcA) { $svcA.Status } else { 'MISSING' })"
          $state += "maria service: $(if ($svcM) { $svcM.Status } else { 'MISSING' })"
          $snapshot = Join-Path $env:GITHUB_WORKSPACE "ci-install-state.txt"
          Set-Content -Path $snapshot -Value ($state -join "`r`n") -Encoding UTF8
          Write-Host ($state -join "`n")

          # 采集运行环境日志，供失败时审计
          foreach ($logPair in @(
            @("C:\ProgramData\MOS-GOV\logs\installer.log","ci-runtime-installer.log"),
            @("C:\ProgramData\MOS-GOV\logs\apache-error.log","ci-apache-error.log"),
            @("C:\ProgramData\MOS-GOV\logs\launcher.log","ci-launcher.log")
          )) {
            if (Test-Path $logPair[0]) {
              Copy-Item $logPair[0] (Join-Path $env:GITHUB_WORKSPACE $logPair[1]) -Force -ErrorAction SilentlyContinue
            }
          }
          if (Test-Path $setupLog) {
            Copy-Item $setupLog (Join-Path $env:GITHUB_WORKSPACE "ci-inno-setup.log") -Force -ErrorAction SilentlyContinue
          }

          if ($fatal) { throw "MOS-GOV runtime installation reported a fatal error: $fatal" }
          if (-not $done) {
            if (Test-Path -LiteralPath $runtimeLog) { Write-Host "--- installer.log (tail 40) ---"; Get-Content -LiteralPath $runtimeLog -Tail 40 }
            $found = ((@($lnks) | ForEach-Object { $_.FullName }) -join ', ')
            throw "Installation did not complete within 15 minutes (shortcuts=[$found], apache=$($svcA.Status), maria=$($svcM.Status))."
          }

          # 桌面快捷方式必须存在、名称必须为 "MOS 平台"、指向 MOSLauncher.exe 并使用 MOS.ico。
          # 名称断言是关键：它直接捕获"安装包内中文被编码损坏"这类缺陷。
          $shortcuts = @(Get-DesktopMosShortcuts)
          if ($shortcuts.Count -eq 0) { throw "No MOS desktop shortcut was created (expected name '$expectedShortcutName')." }
          $lnk = $shortcuts[0].FullName
          $actualName = [System.IO.Path]::GetFileNameWithoutExtension($lnk)
          Write-Host "Desktop shortcut: $lnk"
          if ($actualName -ne $expectedShortcutName) {
            throw "Desktop shortcut must be named '$expectedShortcutName', found '$actualName' (Chinese text in the built installer is corrupted)."
          }
          # 目标 / 图标校验：直接读取 .lnk 的二进制内容做搜索（对 UTF-16LE 的两种字节对齐都解码），
          # 不再依赖 WScript.Shell 的 COM 解析。
          # 原因：在 Windows Server 2025 runner 上，COM 的 TargetPath 对 Inno 生成的快捷方式返回
          # 空字符串——这是"探测方式"的问题，不是快捷方式的问题（本机双击该快捷方式可正常启动启动器）。
          $lnkBytes = [System.IO.File]::ReadAllBytes($lnk)
          $lnkText = [System.Text.Encoding]::Unicode.GetString($lnkBytes, 0, $lnkBytes.Length - ($lnkBytes.Length % 2))
          if ($lnkBytes.Length -gt 2) {
            $off = 1
            $len = ($lnkBytes.Length - $off) - (($lnkBytes.Length - $off) % 2)
            if ($len -gt 0) {
              $lnkText = $lnkText + "`n" + [System.Text.Encoding]::Unicode.GetString($lnkBytes, $off, $len)
            }
          }
          Write-Host ("Shortcut references MOSLauncher.exe: " + ($lnkText -match 'MOSLauncher\.exe'))
          Write-Host ("Shortcut references MOS.ico: " + ($lnkText -match 'MOS\.ico'))
          if ($lnkText -notmatch 'MOSLauncher\.exe') { throw "Shortcut does not reference MOSLauncher.exe." }
          if ($lnkText -notmatch 'MOS\.ico') { throw "Shortcut does not reference MOS.ico." }
          # COM 视角仅作参考记录（部分 Windows 版本返回空值）
          try {
            $sh = New-Object -ComObject WScript.Shell
            $sc = $sh.CreateShortcut($lnk)
            Write-Host ("COM TargetPath (informational): '" + $sc.TargetPath + "'")
            Write-Host ("COM IconLocation (informational): '" + $sc.IconLocation + "'")
          } catch {
            Write-Host "COM shortcut inspection unavailable: $($_.Exception.Message)"
          }

          # 开始菜单分组（DefaultGroupName）也必须生成，且同样不允许出现乱码名称。
          $programs = [Environment]::GetFolderPath('CommonPrograms')
          $groupDir = @(Get-ChildItem -LiteralPath $programs -Directory -ErrorAction SilentlyContinue |
                        Where-Object { $_.Name -like 'MOS*' })
          if ($groupDir.Count -eq 0) { throw "Start-menu group for MOS-GOV was not created under $programs." }
          $groupLinks = @(Get-ChildItem -LiteralPath $groupDir[0].FullName -Filter '*.lnk' -File -ErrorAction SilentlyContinue)
          Write-Host ("Start-menu group: " + $groupDir[0].FullName + " (" + $groupLinks.Count + " shortcuts)")
          if ($groupLinks.Count -lt 3) { throw "Start-menu group must contain the launcher, diagnostics and reset shortcuts." }
          if (-not ($groupLinks.BaseName -contains $expectedShortcutName)) {
            throw "Start-menu group is missing a shortcut named '$expectedShortcutName' (found: $($groupLinks.BaseName -join ', '))."
          }

          # 服务必须存在且运行（给运行环境初始化留出启动时间）
          $svcDeadline = (Get-Date).AddMinutes(3)
          do {
            $svcA = Get-Service -Name "MOS-GOV-Apache" -ErrorAction SilentlyContinue
            $svcM = Get-Service -Name "MOS-GOV-MariaDB" -ErrorAction SilentlyContinue
            if ($svcA -and $svcM -and $svcA.Status -eq "Running" -and $svcM.Status -eq "Running") { break }
            Start-Sleep -Seconds 3
          } while ((Get-Date) -lt $svcDeadline)
          $apache = Get-Service -Name "MOS-GOV-Apache" -ErrorAction Stop
          $maria = Get-Service -Name "MOS-GOV-MariaDB" -ErrorAction Stop
          if ($apache.Status -ne "Running") { throw "MOS-GOV-Apache is not running." }
          if ($maria.Status -ne "Running") { throw "MOS-GOV-MariaDB is not running." }

          # 从真实配置读取端口
          $conf = Join-Path $env:ProgramFiles "MOS-GOV\Apache24\conf\httpd.conf"
          $listen = (Select-String -Path $conf -Pattern '^\s*Listen\s+' | Select-Object -First 1).Line
          $port = [int]($listen -replace '^\s*Listen\s+(?:[^:\s]+:)?','')
          Write-Host "Detected HTTP port: $port"

          # HTTP 健康检查
          $url = "http://127.0.0.1:$port/session/begin"
          $deadline = (Get-Date).AddMinutes(3)
          do {
            try {
              $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 15
              if ($r.StatusCode -ge 200 -and $r.StatusCode -lt 500) { break }
            } catch {}
            Start-Sleep -Seconds 3
          } while ((Get-Date) -lt $deadline)
          if ((Get-Date) -ge $deadline) { throw "ChurchCRM did not become reachable at $url." }

          # 真实页面验收：登录页必须包含中文表单
          $html = (Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 15).Content
          if ($html -notmatch 'ChurchCRM') { throw "Login page did not render ChurchCRM content." }
          Write-Host "Real page check passed at $url"

          $pluginUrl = "http://127.0.0.1:$port/plugins/mos-gov"
          try {
            $pr = Invoke-WebRequest -Uri $pluginUrl -UseBasicParsing -TimeoutSec 15 -MaximumRedirection 5
            Write-Host ("MOS-GOV plugin endpoint: HTTP " + $pr.StatusCode)
          } catch {
            $code = $null
            if ($_.Exception.Response) { $code = [int]$_.Exception.Response.StatusCode }
            if (-not $code -or $code -ge 500 -or $code -eq 404) {
              throw "MOS-GOV endpoint smoke test failed: $($_.Exception.Message)"
            }
          }

          Write-Host "Installer smoke test passed."
          Stop-Transcript | Out-Null

      - name: Calculate installer hash
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist\$env:SETUP_EXE"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $size = (Get-Item $exe).Length
          Write-Host ("SHA256 " + $hash)
          Write-Host ("SIZE   " + $size)
          Write-Host ("FILE   " + $exe)
          # 作业日志需要登录才能查看，因此同时把哈希写入 Step Summary，
          # 并在下一步提交到仓库根目录（公开可匿名读取），供安装前校验。
          "## MOS-GOV V0.2.3 安装包校验值`n`n| 项目 | 值 |`n| --- | --- |`n| 文件 | ``$env:SETUP_EXE`` |`n| 字节数 | $size |`n| SHA-256 | ``$hash`` |" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Publish installer checksum
        # 校验值发布失败不应判定构建失败（安装包本体与产物上传已成功），
        # 但会把原因写进日志，避免出现"静默失败"。
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist\$env:SETUP_EXE"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $size = (Get-Item $exe).Length
          $root = $env:GITHUB_WORKSPACE

          # 1) 标准 SHA256SUMS 文本（同一行含文件名，便于 certutil / sha256sum 直接校验）
          $sumsPath = Join-Path $root "MOS-GOV-V0.2.3-Setup.sha256.txt"
          $sumsLine = ("{0}  {1}" -f $hash.ToLowerInvariant(), $env:SETUP_EXE)
          [System.IO.File]::WriteAllText(
            $sumsPath,
            ($sumsLine + "`n"),
            (New-Object System.Text.UTF8Encoding($false)))

          # 2) 结构化元数据，记录是哪一次运行、哪一个提交产出的
          $metaPath = Join-Path $root "MOS-GOV-V0.2.3-Setup.sha256.json"
          $meta = [ordered]@{
            product    = "MOS-GOV 教会治理平台"
            version    = "0.2.3"
            installer  = $env:SETUP_EXE
            bytes      = $size
            sha256     = $hash.ToLowerInvariant()
            runId      = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            commit     = $env:GITHUB_SHA
            branch     = $env:GITHUB_REF_NAME
            runnerOs   = $env:ImageOS
            builtAtUtc = (Get-Date).ToUniversalTime().ToString("o")
          }
          [System.IO.File]::WriteAllText(
            $metaPath,
            (($meta | ConvertTo-Json) + "`n"),
            (New-Object System.Text.UTF8Encoding($false)))
          Write-Host ("Checksum files written: {0} / {1}" -f $sumsPath, $metaPath)
          Write-Host ("SHA256 " + $hash)

          git config user.name "mos-gov-ci"
          git config user.email "mos-gov-ci@users.noreply.github.com"
          $files = @("MOS-GOV-V0.2.3-Setup.sha256.txt", "MOS-GOV-V0.2.3-Setup.sha256.json")

          # 分支可能已被其他提交推进（例如诊断提交或人工提交），直接 push 会因非快进被拒，
          # 而 pull 在历史不相关时会直接失败。校验值文件是本次运行的生成物、与历史无关，
          # 因此同步到真实远端顶端后重新提交一次，可保证永远是一个快进推送。
          git fetch origin $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed before publishing checksum." }
          $remoteRef = "origin/" + $env:GITHUB_REF_NAME
          & git rev-parse --verify --quiet $remoteRef | Out-Null
          if ($LASTEXITCODE -eq 0) {
            git reset --mixed $remoteRef
            if ($LASTEXITCODE -ne 0) { throw "git reset to $remoteRef failed." }
          } else {
            Write-Host ("Remote ref {0} not found; committing on current HEAD." -f $remoteRef)
          }

          # 幂等：JSON 里带 builtAtUtc，每次运行都会变。因此用"只含哈希与文件名"的
          # sha256.txt 作为是否真需要提交的判据——哈希没变就不产生任何提交。
          $remoteSums = (git show ("HEAD:" + $files[0])) 2>$null
          if ($LASTEXITCODE -eq 0 -and $remoteSums) {
            $remoteText = (($remoteSums | Out-String).Trim())
            if ($remoteText -eq $sumsLine) {
              Write-Host ("Published checksum already matches this build ({0}); no commit needed." -f $hash)
              # 不提交也要把工作区恢复成与 HEAD 一致（生成的 JSON 带新时间戳），
              # 避免把工作区留在"有未暂存改动"的状态。
              git checkout -- @files
              exit 0
            }
            Write-Host ("Published checksum differs: '{0}' -> '{1}'" -f $remoteText, $sumsLine)
          }

          git add @files
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "Checksum unchanged; nothing to commit."; exit 0 }
          git commit -m "ci: publish MOS-GOV V0.2.3 installer checksum [skip ci]"
          if ($LASTEXITCODE -ne 0) { throw "git commit failed for checksum." }
          git push origin ("HEAD:" + $env:GITHUB_REF_NAME)
          if ($LASTEXITCODE -ne 0) { throw "git push failed for checksum commit." }
          # 重置过 index 之后工作区可能残留未暂存差异（例如远端新增文件尚未落盘），
          # 这里补齐为干净工作区；失败不影响已完成的推送。
          git checkout -- .
          Write-Host "Checksum published to repository."

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MOS-GOV-V0.2.3-Windows-Installer
          path: |
            dist/${{ env.SETUP_EXE }}
            dist/MOS-GOV-V0.2.3-Setup.sha256.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $report = @()
          $report += "MOS-GOV CI failure diagnostics @ " + (Get-Date).ToUniversalTime().ToString("o")
          $report += "runner image: " + $env:ImageOS + " / " + $env:RUNNER_OS
          $report += ""
          $report += "=== Inno Setup log (tail 150) ==="
          if (Test-Path "$env:TEMP\MOS-GOV-Setup.log") { $report += (Get-Content "$env:TEMP\MOS-GOV-Setup.log" -Tail 150) } else { $report += "(missing)" }
          $report += ""
          $report += "=== build.ps1 output (tail 80) ==="
          if (Test-Path "$env:GITHUB_WORKSPACE\ci-build.log") { $report += (Get-Content "$env:GITHUB_WORKSPACE\ci-build.log" -Tail 80) } else { $report += "(missing: build log not captured)" }
          $report += ""
          $report += "=== runtime installer.log (tail 120) ==="
          if (Test-Path "C:\ProgramData\MOS-GOV\logs\installer.log") { $report += (Get-Content "C:\ProgramData\MOS-GOV\logs\installer.log" -Tail 120) } else { $report += "(missing)" }
          $report += ""
          $report += "=== smoke-test install snapshot ==="
          if (Test-Path "$env:GITHUB_WORKSPACE\ci-install-state.txt") { $report += (Get-Content "$env:GITHUB_WORKSPACE\ci-install-state.txt") } else { $report += "(missing)" }
          $report += ""
          $report += "=== collected runtime installer.log (tail 150) ==="
          if (Test-Path "$env:GITHUB_WORKSPACE\ci-runtime-installer.log") { $report += (Get-Content "$env:GITHUB_WORKSPACE\ci-runtime-installer.log" -Tail 150) } else { $report += "(missing)" }
          $report += ""
          $report += "=== services ==="
          $report += ((Get-Service -Name 'MOS-GOV-*' -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String))
          $report += "=== listening ports (80/8080/8081/3306/3307) ==="
          $report += ((Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -in @(80,8080,8081,3306,3307) } | Format-Table -AutoSize | Out-String))
          $report += "=== dist ==="
          $report += ((Get-ChildItem "$env:GITHUB_WORKSPACE\dist" -ErrorAction SilentlyContinue | Select-Object Name,Length | Format-Table -AutoSize | Out-String))
          $report += "=== httpd.conf Listen ==="
          $conf = Join-Path $env:ProgramFiles "MOS-GOV\Apache24\conf\httpd.conf"
          if (Test-Path $conf) { $report += ((Select-String -Path $conf -Pattern '^\s*Listen\s+' | ForEach-Object { $_.Line })) } else { $report += "(missing)" }
          $report += "=== apache error log (tail 60) ==="
          if (Test-Path "C:\ProgramData\MOS-GOV\logs\apache-error.log") { $report += (Get-Content "C:\ProgramData\MOS-GOV\logs\apache-error.log" -Tail 60) } else { $report += "(missing)" }
          $report += "=== smoke test transcript (tail 120) ==="
          if (Test-Path "$env:GITHUB_WORKSPACE\ci-smoke.log") { $report += (Get-Content "$env:GITHUB_WORKSPACE\ci-smoke.log" -Tail 120) } else { $report += "(missing: smoke transcript not captured)" }
          $report += ""
          $report += "=== desktop shortcuts actually present ==="
          $report += ((Get-ChildItem ([Environment]::GetFolderPath('Desktop')) -Filter '*.lnk' -ErrorAction SilentlyContinue |
                       Select-Object -ExpandProperty Name) -join "`r`n")
          $report += "=== start menu groups actually present ==="
          $report += ((Get-ChildItem ([Environment]::GetFolderPath('CommonPrograms')) -Directory -ErrorAction SilentlyContinue |
                       Select-Object -ExpandProperty Name) -join "`r`n")
          $report += "=== generated build script: shortcut lines (ISCC input) ==="
          $buildIss = Join-Path $env:GITHUB_WORKSPACE "installer-build\MOS-GOV-V0.2.iss"
          if (Test-Path $buildIss) {
            $report += ([System.IO.File]::ReadAllLines($buildIss) | Where-Object { $_ -like '*commondesktop*' -or $_ -like '*AppName*' })
          } else { $report += "(missing: build script was not generated)" }
          $report += "=== launcher log (tail 40) ==="
          if (Test-Path "C:\ProgramData\MOS-GOV\logs\launcher.log") { $report += (Get-Content "C:\ProgramData\MOS-GOV\logs\launcher.log" -Tail 40) } else { $report += "(missing)" }
          Set-Content -Path "$env:GITHUB_WORKSPACE\ci-diagnostics.txt" -Value ($report -join "`r`n") -Encoding UTF8
          git config user.name "mos-gov-ci"
          git config user.email "mos-gov-ci@users.noreply.github.com"
          # 提交全部诊断产物，而不只是汇总文件，便于事后审计真实失败原因。
          $artifacts = @(
            "ci-diagnostics.txt",
            "ci-build.log",
            "ci-smoke.log",
            "ci-install-state.txt",
            "ci-inno-setup.log",
            "ci-runtime-installer.log",
            "ci-apache-error.log",
            "ci-launcher.log"
          ) | Where-Object { Test-Path (Join-Path $env:GITHUB_WORKSPACE $_) }
          if (@($artifacts).Count -eq 0) { Write-Host "No diagnostics artifacts to publish."; exit 0 }
          Write-Host ("Publishing: " + (@($artifacts) -join ', '))
          git add @artifacts
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "ci: failure diagnostics [skip ci]"
            git push
          } else {
            Write-Host "Diagnostics unchanged; nothing to commit."
          }

      - name: Cleanup installed services
        if: always()
        shell: pwsh
        run: |
          $clean = Join-Path $env:GITHUB_WORKSPACE "installer\runtime\uninstall-runtime.ps1"
          if (Test-Path $clean) {
            powershell -NoProfile -ExecutionPolicy Bypass -File $clean
          }
          Remove-Item "$env:ProgramData\MOS-GOV" -Recurse -Force -ErrorAction SilentlyContinue

