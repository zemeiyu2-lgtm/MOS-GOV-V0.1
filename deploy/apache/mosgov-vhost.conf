# MOS-GOV 独立 Apache 2.4 vhost 模板（每教会一份）
# 由 provision-tenant.sh 渲染到 /etc/apache2/sites-available/mosgov-<tenant>.conf
# 占位符：__HOST__ __TENANT_ID__ __TENANT_DB__ __TENANT_STORAGE__ __DOCROOT__

<VirtualHost *:8080>
    ServerName __HOST__
    DocumentRoot __DOCROOT__

    # TLS 在上一层（云负载均衡 / 本机 nginx / certbot SSL vhost）终结。
    # 该 vhost 只监听回环，外部无法绕过 TLS 直接访问 8080。
    SetEnv HTTPS on
    SetEnv MOSGOV_DEPLOYMENT public
    SetEnv MOS_GOV_SECURITY_MODE LOCAL
    SetEnv MOSGOV_TENANT_ID __TENANT_ID__
    SetEnv MOSGOV_TENANT_DB __TENANT_DB__
    SetEnv MOSGOV_TENANT_HOST __HOST__
    SetEnv MOSGOV_TENANT_STORAGE __TENANT_STORAGE__
    SetEnv MOSGOV_TRUSTED_PROXIES 127.0.0.1

    # ---- 传输与安全响应头 -------------------------------------------------
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    Header always set Cache-Control "no-store"

    # ---- 敏感目录一律拒绝直接 HTTP 访问（SEC-05/06/08/09）-----------------
    # 原 root .htaccess 对「已存在的文件」直接放行，导致：
    #   /logs/*.log、/plugins/community/mos-gov/database/*.sql、/docs/*.md
    # 可被直接下载。这里在 vhost 层统一封死，不依赖 .htaccess 是否生效。
    <Directory "__DOCROOT__/Include">
        Require all denied
    </Directory>
    <Directory "__DOCROOT__/logs">
        Require all denied
    </Directory>
    <Directory "__DOCROOT__/tmp_attach">
        Require all denied
    </Directory>
    <Directory "__DOCROOT__/Images/Person">
        Require all denied
    </Directory>
    <Directory "__DOCROOT__/plugins/community/mos-gov/database">
        Require all denied
    </Directory>
    <Directory "__DOCROOT__/plugins/community/mos-gov/src">
        Require all denied
    </Directory>
    <Directory "__DOCROOT__/plugins/community/mos-gov/tests">
        Require all denied
    </Directory>

    # 上传文件根目录在 Web 根之外，物理上不可能被静态直出。
    # __TENANT_STORAGE__ 必须由 authenticated download endpoint 读取。

    <FilesMatch "\.(sql|md|log|ini|env|json|bak|old|pem|key|phar|phtml|pht|php3|php4|php5|php7|php8)$">
        Require all denied
    </FilesMatch>
    # 允许应用入口 PHP（由下面的 FPM 处理），排除上面的伪静态路径。
    <FilesMatch "^(index|router)\.php$">
        Require all granted
    </FilesMatch>

    <Directory "__DOCROOT__">
        Options -Indexes -Includes -ExecCGI
        AllowOverride FileInfo Indexes Limit Options=Indexes
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # ---- PHP-FPM（独立 pool，每教会一个系统账号）---------------------------
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.4-fpm-mosgov-__TENANT_ID__.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog  /var/log/mosgov/__TENANT_ID__/apache-error.log
    CustomLog /var/log/mosgov/__TENANT_ID__/apache-access.log combined
</VirtualHost>

# ---------------------------------------------------------------------------
# TLS vhost（certbot 管理证书）：把 443 反代到上面的 127.0.0.1:8080
# 若使用云负载均衡做 TLS 终结，则删除这一段，由 LB 转发到 8080。
# <VirtualHost *:443>
#     ServerName __HOST__
#     SSLEngine on
#     SSLCertificateFile      /etc/letsencrypt/live/__HOST__/fullchain.pem
#     SSLCertificateKeyFile   /etc/letsencrypt/live/__HOST__/privkey.pem
#     SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
#     SSLCipherSuite          HIGH:!aNULL:!MD5
#     RequestHeader set X-Forwarded-Proto "https"
#     ProxyPreserveHost On
#     ProxyPass        / http://127.0.0.1:8080/
#     ProxyPassReverse / http://127.0.0.1:8080/
# </VirtualHost>
