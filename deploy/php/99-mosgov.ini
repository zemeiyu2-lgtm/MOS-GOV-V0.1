; MOS-GOV production PHP settings (per FPM pool, per church)
; Install to /etc/php/8.4/fpm/conf.d/99-mosgov.ini, then reload php8.4-fpm.
; Runtime ini_set() for session.* is NOT reliable (fails once output has been
; sent, observed on PHP 8.4.25 CLI). These server-level values are the
; authoritative control; SessionHardening::apply() verifies and fails closed.

session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_lifetime = 0
session.gc_maxlifetime = 1800

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
expose_php = Off
allow_url_fopen = Off
allow_url_include = Off
file_uploads = On
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 60
memory_limit = 256M

; 生产环境统一 UTC 存储、Asia/Shanghai 展示
date.timezone = Asia/Shanghai
